# Publishes the NECKTIED patcher web page on GitHub Pages.
# Runs when a release is published (and by hand). It takes necktied-package.zip from the latest
# published release, checks it against SHA256SUMS.txt and assembles the page with web/build_site.py.
# A release draft changes nothing on the page.
# One-time setup: Settings -> Pages -> Source "GitHub Actions".
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" \
            --pattern necktied-package.zip --pattern SHA256SUMS.txt --dir release
          cd release && grep ' necktied-package.zip$' SHA256SUMS.txt | sha256sum -c -

      - name: Assemble the page
        run: python3 -I web/build_site.py _site --package release/necktied-package.zip --repo "${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
